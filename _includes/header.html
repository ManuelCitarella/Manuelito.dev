<header class="site-header">
	<a href="{{ '/' | relative_url }}" class="site-logo">Manuelito > Dev </a>
	<div class="site-header-actions">
		<a href="{{ '/' | relative_url }}" id="home-link" aria-label="Articles home"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="m12 3-9 8h2v9h5v-6h4v6h5v-9h2l-9-8Zm5 15h-1v-6H8v6H7v-9.18l5-4.44 5 4.44V18Z"/></svg></a>
		<a href="{{ '/about/' | relative_url }}" id="about-link" aria-label="About me">i</a>
		<a href="{{ '/projects/' | relative_url }}" id="projects-link" aria-label="Personal projects">&gt;</a>
		<a href="{{ '/contacts/' | relative_url }}" id="contacts-link" aria-label="Contacts">@</a>
		<button id="theme-toggle" aria-label="Toggle dark mode">0</button>
	</div>
</header>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    var root = document.documentElement;
    var setIcon = function () {
      btn.textContent = root.getAttribute('data-theme') === 'dark' ? '1' : '0';
    };
    setIcon();
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      setIcon();
    });
  })();
</script>
